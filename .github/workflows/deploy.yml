name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel in-progress if a new push arrives
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # Same build as local: type check (tsc -b) + vite build — so type errors can't hide (B004)
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          # The live online server (party/, deployed with `npx partykit deploy`) — public, not a secret
          # VITE_PARTY_HOST: <online server address> — off until the server has a home (PartyKit's shared partykit.dev zone is full, 2026-09-30; moving to Muzzy's own Cloudflare). Unset = 'Play online' hidden on the live site.

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
